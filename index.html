<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sayi Tahmin Oyunu</title>
</head>
<body>
    <header>
          <h1>Sayi Tahmin Et</h1>
          <p class="between">(1-20 arasi)</p>
          <button class=" btn again">Tekrar Başlat</button>
          <div class="number">?</div>
    </header>

    <main>
           <section class="left">
           <input class="guess" type=" number">
           <button class="btn check">kontrol et</button>
           </section>

           <section class="right">
            <p class="message">Tahmin ediliyor</p>
            <p class="label-score">Skor:20</p>
            <p class="label-highscore">en yüksek skor</p>

           </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
